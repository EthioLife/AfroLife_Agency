name: AfroLife quality checks

on:
  push:
    paths:
      - 'afrolife/**'
      - '.github/workflows/afrolife-quality.yml'
  pull_request:
    paths:
      - 'afrolife/**'
      - '.github/workflows/afrolife-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: afrolife

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: afrolife/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx --sbom-type=application > afrolife.cdx.json
      - name: Retain SBOM release evidence
        uses: actions/upload-artifact@v4
        with:
          name: afrolife-cyclonedx-sbom
          path: afrolife/afrolife.cdx.json
          if-no-files-found: error
          retention-days: 90
      - name: Check browser JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/api-errors.js
          node --check public/mfi.js
          node --check public/edir.js
          node --check public/privacy.js
          node --check public/i18n.js
          node --check public/sw.js
      - name: Validate app configuration JSON
        run: |
          node -e "for (const f of ['package.json','capacitor.config.json','public/manifest.webmanifest','admin-app/environments.json']) JSON.parse(require('node:fs').readFileSync(f,'utf8'))"
      - name: Test Admin environment launcher
        run: node --test admin-app/test/launcher.test.mjs
      - name: Sync iOS Capacitor project
        run: npm run ios:sync
      - name: Sync Android Capacitor project
        run: npx cap sync android
      - name: Build Android debug app
        run: ./gradlew --no-daemon assembleDebug
        working-directory: afrolife/android
      - run: npm run build
      - run: npm run build:insurance
      - run: npm run build:accounting
      - run: npm run build:global-bi
      - run: npm run build:edir
      - run: npm run build:mfi
      - run: npm run build:agency-domains
      - run: npm run test:unit

  disposable-database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: afrolife
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d afrolife"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/afrolife
      JWT_SECRET: ci-only-integration-jwt-secret-not-for-deployments
      MFA_ENC_KEY: ci-only-integration-mfa-key-not-for-deployments
      AFROLIFE_TEST_POSTGRES_CONTAINER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: afrolife/package-lock.json
      - run: npm ci
      - name: Run integration workflows against disposable PostgreSQL service
        run: node scripts/run-local-finance-e2e.mjs

  migration-changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/aletcloud-development'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect migration changes in this push
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$BEFORE^{commit}"; then
            echo "::error::Cannot verify the push base commit; refusing to skip migrations."
            exit 1
          fi
          if git diff --name-only "$BEFORE" "$AFTER" | grep -q '^afrolife/migrations/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  migrate-development:
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/aletcloud-development' &&
        needs.migration-changes.outputs.changed == 'true'
      }}
    needs:
      - unit-and-build
      - disposable-database-integration
      - migration-changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: afrolife-development
    concurrency:
      group: afrolife-development-schema
      cancel-in-progress: false
    defaults:
      run:
        working-directory: afrolife
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: afrolife/package-lock.json
      - run: npm ci
      - name: Require Development database credentials
        env:
          DATABASE_URL: ${{ secrets.ALETCLOUD_DEVELOPMENT_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.ALETCLOUD_DEVELOPMENT_MIGRATION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$MIGRATION_DATABASE_URL" ]; then
            echo "::error::Configure the Development runtime and migration URLs in the afrolife-development GitHub Environment."
            exit 1
          fi
      - name: Apply checksummed Development migrations
        env:
          DATABASE_URL: ${{ secrets.ALETCLOUD_DEVELOPMENT_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.ALETCLOUD_DEVELOPMENT_MIGRATION_DATABASE_URL }}
        run: npm run db:migrate
