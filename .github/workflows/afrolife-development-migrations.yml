name: AfroLife Development database migrations

on:
  workflow_run:
    workflows:
      - AfroLife quality checks
    types:
      - completed
    branches:
      - aletcloud-development

permissions:
  contents: read

concurrency:
  group: afrolife-development-schema
  cancel-in-progress: false

jobs:
  migrate-development:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: afrolife-development
    defaults:
      run:
        working-directory: afrolife
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: afrolife/package-lock.json
      - run: npm ci
      - name: Require Development database credentials
        env:
          DATABASE_URL: ${{ secrets.ALETCLOUD_DEVELOPMENT_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.ALETCLOUD_DEVELOPMENT_MIGRATION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$MIGRATION_DATABASE_URL" ]; then
            echo "::error::Configure the Development runtime and migration URLs in the afrolife-development GitHub Environment."
            exit 1
          fi
      - name: Apply checksummed Development migrations
        env:
          DATABASE_URL: ${{ secrets.ALETCLOUD_DEVELOPMENT_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.ALETCLOUD_DEVELOPMENT_MIGRATION_DATABASE_URL }}
        run: npm run db:migrate
