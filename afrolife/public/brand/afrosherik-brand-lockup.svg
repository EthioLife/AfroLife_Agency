<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 152" role="img" aria-labelledby="title desc">
  <title id="title">AfroSherik</title>
  <desc id="desc">AfroSherik, አፍሮ-ሸሪክ. Connect · Access · Thrive.</desc>
  <defs>
    <linearGradient id="green-ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#57d49b"/>
      <stop offset=".38" stop-color="#15936a"/>
      <stop offset="1" stop-color="#07533f"/>
    </linearGradient>
    <linearGradient id="gold-ribbon" x1="0" y1="0" x2=".15" y2="1">
      <stop offset="0" stop-color="#fff3a7"/>
      <stop offset=".3" stop-color="#ffd24d"/>
      <stop offset=".68" stop-color="#e99a19"/>
      <stop offset="1" stop-color="#bd7112"/>
    </linearGradient>
    <linearGradient id="wordmark-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe17a"/>
      <stop offset=".48" stop-color="#ffc438"/>
      <stop offset="1" stop-color="#d88712"/>
    </linearGradient>
    <linearGradient id="wordmark-white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#dce8e2"/>
    </linearGradient>
    <filter id="raised" x="-.2" y="-.2" width="1.5" height="1.55" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blur"/>
      <feOffset in="blur" dx="1" dy="3" result="shadow-offset"/>
      <feFlood flood-color="#06251d" flood-opacity=".62" result="shadow-color"/>
      <feComposite in="shadow-color" in2="shadow-offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="type-depth" x="-.08" y="-.2" width="1.2" height="1.5" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur"/>
      <feOffset in="blur" dx="1" dy="2" result="shadow-offset"/>
      <feFlood flood-color="#08271f" flood-opacity=".72" result="shadow-color"/>
      <feComposite in="shadow-color" in2="shadow-offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g stroke-linejoin="round" filter="url(#raised)">
    <path class="green-ribbon" d="M11 92C25 72 35 39 52 15 60 4 69 5 77 17c11 18 18 42 32 57 10 11 23 14 39 5-7 16-22 22-37 17-18-6-28-24-37-44-5-11-9-18-14-19-12 17-23 48-38 67-6 7-14 8-21 2 3-4 6-7 10-10Z" fill="url(#green-ribbon)" stroke="#baf0d2" stroke-opacity=".42" stroke-width="1.4"/>
    <path d="M56 16C65 3 73 0 81 10c12 15 17 37 31 50 10 10 23 14 37 11-7 14-20 19-34 14-18-7-28-25-38-44-6-11-11-18-17-20Z" fill="url(#gold-ribbon)" stroke="#fff4bc" stroke-opacity=".75" stroke-width="1.5"/>
    <path d="M6 98c13-8 20-23 31-35 11-12 21-14 33-5 14 10 20 28 37 33-10 11-23 12-36 4-11-7-17-19-26-18-9 1-17 20-29 28-5 4-11 3-14-1Z" fill="url(#gold-ribbon)" stroke="#fff0ad" stroke-opacity=".65" stroke-width="1.4"/>
  </g>
  <g transform="translate(29 53) scale(.6)" fill="#f3d9a8">
    <path d="M61 112c5-5 11-4 15 1l5 4-1 6 6 5 2 7-5 5-2 7-5 6-2 7-6-2-4-7-5-5-2-7-5-3 2-6-4-4 5-5Z"/>
    <path d="m92 137 4 1-1 5-3 4-2-2z"/>
  </g>
  <path d="M194 104h46" fill="none" stroke="url(#gold-ribbon)" stroke-linecap="round" stroke-width="2" filter="url(#raised)"/>

  <g filter="url(#type-depth)" font-family="Arial, Helvetica, sans-serif" font-size="59" font-weight="700" letter-spacing="-2.1" paint-order="stroke fill" stroke="#fff" stroke-opacity=".2" stroke-width=".65">
    <text x="158" y="72" fill="url(#wordmark-white)">Afro</text>
    <text x="273" y="72" fill="url(#wordmark-gold)">Sherik</text>
  </g>
  <text x="320" y="112" text-anchor="middle" fill="#f3f1e8" font-family="Noto Sans Ethiopic, Abyssinica SIL, Nyala, sans-serif" font-size="24" font-weight="600" letter-spacing=".5" filter="url(#type-depth)">አፍሮ-ሸሪክ</text>
  <text x="220" y="143" fill="#d5ddd8" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" letter-spacing="1.15">Connect</text>
  <circle class="tagline-separator" cx="289" cy="138" r="2.8" fill="#ffd24d"/>
  <text x="298" y="143" fill="#d5ddd8" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" letter-spacing="1.15">Access · Thrive</text>
</svg>
